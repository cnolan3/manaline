[workspace]
resolver = "2"
members = ["crates/engine", "crates/cards", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/connornolan/manaline"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
thiserror = "2"
ron = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
debug = 1

# The property tests play thousands of actions per game; a little optimisation
# in dev builds keeps `cargo test` fast without slowing compiles much.
[profile.dev]
opt-level = 1
