[workspace]
resolver = "2"
members = ["crates/cardir", "crates/engine", "crates/cards", "crates/carddb", "crates/cardsearch", "crates/deckstats", "crates/ingest", "crates/protocol", "crates/daemon", "crates/tui", "crates/mcp", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/connornolan/manaline"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
thiserror = "2"
ron = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"

[profile.release]
debug = 1

# The property tests play thousands of actions per game; a little optimisation
# in dev builds keeps `cargo test` fast without slowing compiles much.
[profile.dev]
opt-level = 1
