[package]
name = "manaline-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The daemon protocol: message types, error shape, NDJSON framing, and a client helper"

[lib]
name = "protocol"
path = "src/lib.rs"

[dependencies]
manaline-engine = { path = "../engine" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "sync", "rt", "macros", "time"] }
async-trait.workspace = true
futures.workspace = true
tokio-tungstenite.workspace = true
tokio-rustls.workspace = true
rustls-pemfile.workspace = true
dirs = "6"
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
