[package]
name = "manaline-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The manaline game daemon: hosts one Game, speaks the protocol over Unix sockets and TCP"

[lib]
name = "daemon"
path = "src/lib.rs"

[dependencies]
manaline-engine = { path = "../engine" }
manaline-cards = { path = "../cards" }
manaline-protocol = { path = "../protocol" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rand.workspace = true
tracing.workspace = true
libc.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "sync", "io-util", "macros", "time", "fs"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
rand_chacha.workspace = true
